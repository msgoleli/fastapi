info:
  name: Keine Treffer
  type: http
  seq: 3

http:
  method: QUERY
  url: "{{restUrl}}/query"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "isbn": "0000000000"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
