info:
  name: Verlag anlegen
  type: http
  seq: 3

http:
  method: POST
  url: "{{restUrl}}/verlage"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Nordlicht Verlag",
        "sitz": "Hamburg",
        "website": "https://example.org"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
