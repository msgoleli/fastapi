opencollection: 1.0.0

info:
  name: Buchkatalog

request:
  variables:
    - name: baseUrl
      value: https://127.0.0.1:8000
    - name: restUrl
      value: "{{baseUrl}}/rest"
    - name: tokenUrl
      value: "{{baseUrl}}/auth/token"
    - name: graphqlUrl
      value: "{{baseUrl}}/graphql"

bundled: false
extensions: {}
