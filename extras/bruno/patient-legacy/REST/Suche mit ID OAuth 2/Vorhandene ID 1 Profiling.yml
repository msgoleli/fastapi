info:
  name: Vorhandene ID 1 Profiling
  type: http
  seq: 5

http:
  method: GET
  url: "{{restUrl}}/:id?profile=1"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: profile
      value: "1"
      type: query
    - name: id
      value: "1"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.id
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
