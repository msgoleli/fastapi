scalar Date

type Query {
  buecher(titel: String): [Buch!]!
  buch(id: Int!): Buch
  autoren: [Autor!]!
  verlage: [Verlag!]!
}

type Mutation {
  buchAnlegen(buch: BuchInput!): Buch!
}

type Buch {
  id: Int!
  titel: String!
  isbn: String!
  erscheinungsdatum: Date!
  genre: String!
  verlag: Verlag!
  autoren: [Autor!]!
}

type Autor {
  id: Int!
  vorname: String!
  nachname: String!
  email: String!
}

type Verlag {
  id: Int!
  name: String!
  sitz: String!
  website: String
}

input BuchInput {
  titel: String!
  isbn: String!
  erscheinungsdatum: Date!
  genre: String!
  verlagId: Int!
  autorenIds: [Int!]!
}
